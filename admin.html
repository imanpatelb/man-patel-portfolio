<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<script>(function(){try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}})();</script>
<title>Admin — Man Patel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23F4F1E9'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%233F5648'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400&family=Inter:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css?v=15">
<style>
  .admin{max-width:760px;margin:0 auto;padding:48px 28px 80px}
  .admin h1{font-family:var(--serif);font-size:30px;margin-bottom:4px}
  .admin .sub{color:var(--ink-soft);font-size:14px;margin-bottom:32px}
  .panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:26px;margin-bottom:24px}
  .row{margin-bottom:16px}
  .row label{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin:0 0 6px}
  .row input,.row select,.row textarea{width:100%;font-family:var(--sans);font-size:15px;color:var(--ink);background:var(--paper);border:1px solid var(--line-strong);border-radius:2px;padding:11px 13px}
  .row textarea{min-height:240px;resize:vertical;font-size:14.5px;line-height:1.6}
  .row input:focus,.row select:focus,.row textarea:focus{outline:none;border-color:var(--sage);box-shadow:0 0 0 3px rgba(63,86,72,.1)}
  .hint{font-size:12px;color:var(--ink-faint);margin-top:6px;font-family:var(--mono)}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .msg{font-family:var(--mono);font-size:12.5px;min-height:18px}
  .msg.ok{color:var(--sage)}.msg.err{color:var(--neg)}
  .plist{list-style:none;margin:0;padding:0}
  .plist li{display:flex;align-items:baseline;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
  .plist li:first-child{border-top:0}
  .plist .pt{font-size:15px}
  .plist .pd,.plist .pg{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .plist .pg{color:var(--sage);text-transform:uppercase;letter-spacing:.08em}
  .plist .del{margin-left:auto;border:1px solid var(--line-strong);background:none;color:var(--neg);font-family:var(--mono);font-size:11px;padding:5px 10px;border-radius:2px;cursor:pointer}
  .plist .del:hover{background:rgba(154,82,64,.08)}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}
  .topbar a{font-family:var(--mono);font-size:12px;color:var(--ink-soft)}
  .linkbtn{background:none;border:0;color:var(--ink-soft);font-family:var(--mono);font-size:12px;cursor:pointer;text-decoration:underline}
  @media(max-width:560px){
    .admin{padding:32px 18px 64px}
    .panel{padding:20px}
    .admin h1{font-size:25px}
    .plist li{flex-wrap:wrap;gap:8px}
    .plist .del{margin-left:0}
  }
</style>
</head>
<body>
<div class="admin">
  <div class="topbar">
    <a href="/">&larr; Back to site</a>
    <button class="linkbtn" id="logout" hidden>Log out</button>
  </div>
  <h1>Write a post</h1>
  <div class="sub">Posts appear in the <strong>Notes</strong> section of your site.</div>

  <!-- login -->
  <div class="panel" id="loginPanel">
    <div class="row">
      <label for="pw">Admin password</label>
      <input id="pw" type="password" placeholder="••••••••" autocomplete="current-password">
      <div class="hint">Set by the ADMIN_PASSWORD environment variable in Vercel.</div>
    </div>
    <button class="btn" id="loginBtn">Enter</button>
    <div class="msg err" id="loginMsg" style="margin-top:12px"></div>
  </div>

  <!-- editor -->
  <div id="app" hidden>
    <div class="panel">
      <div class="row"><label for="title">Title</label><input id="title" type="text" placeholder="What a 9% drawdown actually feels like"></div>
      <div class="row"><label for="tag">Category</label>
        <select id="tag">
          <option value="process">Process</option>
          <option value="risk">Risk</option>
          <option value="markets">Markets</option>
          <option value="letter">Letter</option>
        </select>
      </div>
      <div class="row"><label for="body">Body</label>
        <textarea id="body" placeholder="Write here…"></textarea>
        <div class="hint">Blank line = new paragraph · ## subheading · **bold**</div>
      </div>
      <div class="bar">
        <button class="btn" id="publish">Publish</button>
        <span class="msg" id="msg"></span>
      </div>
    </div>

    <div class="panel">
      <div class="bar" style="margin-bottom:14px"><strong style="font-family:var(--serif);font-size:18px">Published</strong><span class="msg" id="listMsg"></span></div>
      <ul class="plist" id="plist"></ul>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var KEY = "mp_admin_pw";
  var pw = sessionStorage.getItem(KEY) || "";

  function show(authed) {
    $("loginPanel").hidden = authed;
    $("app").hidden = !authed;
    $("logout").hidden = !authed;
    if (authed) loadList();
  }
  function headers() { return { "Content-Type": "application/json", "Authorization": "Bearer " + pw }; }

  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}

  function loadList() {
    fetch("/api/posts").then(function (r) { return r.json(); }).then(function (d) {
      var posts = d.posts || [];
      $("plist").innerHTML = posts.map(function (p) {
        return '<li><span class="pd">' + esc(p.date) + '</span><span class="pt">' + esc(p.title) + '</span><span class="pg">' + esc(p.tag) + '</span><button class="del" data-id="' + esc(p.id) + '">Delete</button></li>';
      }).join("") || '<li style="color:var(--ink-faint)">No posts yet.</li>';
    });
  }

  $("loginBtn").addEventListener("click", function () {
    pw = $("pw").value.trim();
    if (!pw) { $("loginMsg").textContent = "Enter your password."; return; }
    // validate by attempting a harmless authorized no-op (delete a non-existent id)
    fetch("/api/posts", { method: "DELETE", headers: headers(), body: JSON.stringify({ id: "__check__" }) })
      .then(function (r) {
        if (r.status === 401) { $("loginMsg").textContent = "Wrong password."; pw = ""; return; }
        if (!r.ok && r.status === 500) { $("loginMsg").textContent = "Storage not set up yet (KV env vars)."; return; }
        sessionStorage.setItem(KEY, pw); show(true);
      })
      .catch(function () { $("loginMsg").textContent = "Network error."; });
  });
  $("pw").addEventListener("keydown", function (e) { if (e.key === "Enter") $("loginBtn").click(); });

  $("logout").addEventListener("click", function () { sessionStorage.removeItem(KEY); pw = ""; show(false); });

  $("publish").addEventListener("click", function () {
    var title = $("title").value.trim(), body = $("body").value.trim(), tag = $("tag").value;
    var msg = $("msg");
    if (title.length < 2 || body.length < 2) { msg.className = "msg err"; msg.textContent = "Title and body required."; return; }
    $("publish").disabled = true; msg.className = "msg"; msg.textContent = "Publishing…";
    fetch("/api/posts", { method: "POST", headers: headers(), body: JSON.stringify({ title: title, body: body, tag: tag }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, status: r.status, j: j }; }); })
      .then(function (res) {
        if (res.ok) { msg.className = "msg ok"; msg.textContent = "Published ✓"; $("title").value = ""; $("body").value = ""; loadList(); }
        else if (res.status === 401) { msg.className = "msg err"; msg.textContent = "Session expired — log in again."; show(false); }
        else { msg.className = "msg err"; msg.textContent = (res.j && res.j.error) || "Failed to publish."; }
      })
      .catch(function () { msg.className = "msg err"; msg.textContent = "Network error."; })
      .finally(function () { $("publish").disabled = false; });
  });

  $("plist").addEventListener("click", function (e) {
    var b = e.target.closest(".del"); if (!b) return;
    if (!confirm("Delete this post?")) return;
    fetch("/api/posts", { method: "DELETE", headers: headers(), body: JSON.stringify({ id: b.dataset.id }) })
      .then(function (r) { if (r.status === 401) { show(false); return; } loadList(); $("listMsg").textContent = "Deleted."; setTimeout(function(){$("listMsg").textContent="";}, 1500); });
  });

  show(!!pw);
})();
</script>
</body>
</html>
